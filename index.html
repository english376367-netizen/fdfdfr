const DATA={"questions":[{"n":1,"prompt":"Choose the best option to complete blank (1).","opts":{"A":"who","B":"where","C":"whose","D":"which"},"answer":"D","explain":"“Which” là đại từ quan hệ thay thế “tools” và làm chủ ngữ của mệnh đề quan hệ.","section":1},{"n":2,"prompt":"Choose the best option to complete blank (2).","opts":{"A":"join","B":"to join","C":"joining","D":"joined"},"answer":"C","explain":"Sau giới từ “by” sử dụng V-ing: by joining.","section":1},{"n":3,"prompt":"Choose the best option to complete blank (3).","opts":{"A":"measurably","B":"measurable","C":"measure","D":"measurement"},"answer":"B","explain":"Tính từ “measurable” bổ nghĩa cho danh từ “difference”.","section":1},{"n":4,"prompt":"Choose the best option to complete blank (4).","opts":{"A":"carefully selected local resources","B":"resources local selected carefully","C":"selected resources carefully local","D":"local selected carefully resources"},"answer":"A","explain":"Cụm danh từ đúng: carefully selected (phân từ được bổ nghĩa bởi trạng từ) + local (tính từ) + resources (danh từ).","section":1},{"n":5,"prompt":"Choose the best option to complete blank (5).","opts":{"A":"get","B":"take","C":"make","D":"do"},"answer":"C","explain":"Collocation: make a commitment (đưa ra cam kết).","section":1},{"n":6,"prompt":"Choose the best option to complete blank (6).","opts":{"A":"across","B":"with","C":"under","D":"into"},"answer":"D","explain":"Cấu trúc transform ... into ...: biến ... thành ... .","section":1},{"n":7,"prompt":"Choose the best option to complete blank (7).","opts":{"A":"little","B":"many","C":"much","D":"any"},"answer":"B","explain":"Many đi với danh từ đếm được số nhiều “students”.","section":2},{"n":8,"prompt":"Choose the best option to complete blank (8).","opts":{"A":"carry out","B":"look into","C":"put off","D":"give up"},"answer":"A","explain":"Carry out workshops: tổ chức/tiến hành các buổi thực hành; ba đáp án còn lại sai nghĩa.","section":2},{"n":9,"prompt":"Choose the best option to complete blank (9).","opts":{"A":"Because","B":"Unless","C":"Although","D":"Instead"},"answer":"C","explain":"Although nối mệnh đề nhượng bộ: dù trước đó chưa có kinh nghiệm, học sinh vẫn tham gia được.","section":2},{"n":10,"prompt":"Choose the best option to complete blank (10).","opts":{"A":"introduce","B":"introductory","C":"introduction","D":"introducing"},"answer":"B","explain":"Introductory là tính từ bổ nghĩa cho “sessions”.","section":2},{"n":11,"prompt":"Choose the best option to complete blank (11).","opts":{"A":"value","B":"valuably","C":"valuation","D":"valuable"},"answer":"D","explain":"Cần tính từ “valuable” bổ nghĩa cho “skills”.","section":2},{"n":12,"prompt":"Choose the best option to complete blank (12).","opts":{"A":"through","B":"beyond","C":"along","D":"between"},"answer":"A","explain":"Learn through experience: học thông qua trải nghiệm.","section":2},{"n":13,"prompt":"Choose the correct order to make a meaningful conversation.","opts":{"A":"b – c – a","B":"b – a – c","C":"c – b – a","D":"a – b – c"},"answer":"B","explain":"b giới thiệu thông tin; a phản hồi và hỏi; c trả lời câu hỏi mượn thiết bị.","section":3,"arrangementLines":[{"letter":"a","text":"Nam: That sounds useful. Can students borrow the devices after class?"},{"letter":"b","text":"Lan: Our school has just opened a digital learning corner in the library."},{"letter":"c","text":"Lan: Yes, but they need to register at the information desk first."}]},{"n":14,"prompt":"Choose the correct order to make a meaningful conversation.","opts":{"A":"b – a – d – e – c","B":"d – b – c – a – e","C":"a – b – c – d – e","D":"b – d – a – c – e"},"answer":"D","explain":"b đề xuất, d đồng ý giải thích, a đóng góp việc làm, c bổ sung, e xác nhận hành động tiếp theo.","section":3,"arrangementLines":[{"letter":"a","text":"Huy: Good idea. I can design a poster to invite volunteers."},{"letter":"b","text":"Mai: Could we organise a weekend clean-up by the river?"},{"letter":"c","text":"Mai: Great! We should also contact the youth centre for gloves and bags."},{"letter":"d","text":"Huy: Yes. The riverbank has become quite littered recently."},{"letter":"e","text":"Huy: I will call them this afternoon and confirm the supplies."}]},{"n":15,"prompt":"Complete the email. Dear Ms Brown,","opts":{"A":"b – c – a – e – d","B":"b – a – e – d – c","C":"c – b – a – e – d","D":"e – b – c – a – d"},"answer":"A","explain":"b giới thiệu lý do viết thư, c nêu nền tảng, a/e đặt câu hỏi, d kết thư.","section":3,"arrangementLines":[{"letter":"a","text":"I would be grateful if you could tell me whether beginners are welcome."},{"letter":"b","text":"I saw the notice about the school photography club yesterday."},{"letter":"c","text":"I have only used my phone to take pictures, but I would love to improve."},{"letter":"d","text":"Thank you for your time. I look forward to hearing from you."},{"letter":"e","text":"Could you also let me know when the first meeting will take place?\nBest regards,\nAn"}]},{"n":16,"prompt":"Choose the correct order to make a coherent paragraph.","opts":{"A":"e – c – d – b – a","B":"c – b – e – a – d","C":"c – e – b – a – d","D":"d – c – a – e – b"},"answer":"C","explain":"c câu chủ đề, e giải thích, b ví dụ, a kết quả, d mở rộng lợi ích.","section":3,"arrangementLines":[{"letter":"a","text":"Consequently, families can save money while producing less household waste."},{"letter":"b","text":"For example, repairing a broken bag is often cheaper than purchasing a new one."},{"letter":"c","text":"Choosing to repair everyday objects is a practical step towards sustainable living."},{"letter":"d","text":"This habit also encourages people to value the resources used to make their belongings."},{"letter":"e","text":"Rather than throwing damaged items away, people can give them a longer life."}]},{"n":17,"prompt":"Choose the correct order to make a coherent paragraph.","opts":{"A":"b – a – d – c – e","B":"a – b – c – e – d","C":"c – b – d – a – e","D":"b – c – a – d – e Read the following passage and mark A, B, C or D to indicate the option that best fits each numbered blank from 18 to 22. THE SECOND LIFE OF EVERYDAY THINGS The story of a student-led repair project (18) ______. It began when a group of teenagers noticed that many usable objects were being discarded simply because of minor damage. They invited local volunteers (19) ______. After collecting broken lamps, bags and bicycles from nearby homes, (20) ______. During the first event, volunteers worked alongside teenagers to explain simple repairs. (21) ______. More importantly, participants began to understand the environmental cost of constantly buying replacements. The project demonstrates a wider lesson about responsible consumption. (22) ______."},"answer":"D","explain":"b khái quát thuận lợi, c ví dụ, a chuyển ý hạn chế, d giải pháp, e kết luận.","section":3,"arrangementLines":[{"letter":"a","text":"However, constant notifications can interrupt concentration and reduce the quality of learning."},{"letter":"b","text":"Digital platforms have made educational resources easier to access than ever before."},{"letter":"c","text":"Students can watch tutorials, practise languages and collaborate on projects online."},{"letter":"d","text":"Therefore, learners should set clear goals and manage screen time carefully."},{"letter":"e","text":"Used responsibly, technology can support both independence and academic progress."}]},{"n":18,"prompt":"Choose the best option to complete blank (18).","opts":{"A":"has encouraged students to rethink their daily habits","B":"which has inspired schools to rethink their waste policies","C":"whose encouragement of students has grown rapidly","D":"encouraging people without offering practical alternatives"},"answer":"A","explain":"Chủ ngữ “The story of the project” cần vị ngữ “has encouraged ...”.","section":4},{"n":19,"prompt":"Choose the best option to complete blank (19).","opts":{"A":"whose repaired bicycles were taught to students","B":"who repaired bicycles and showed pupils how to do the same","C":"who repairs bicycles only for professional athletes","D":"repairing bicycles which they was broken"},"answer":"B","explain":"Mệnh đề quan hệ “who repaired ...” bổ nghĩa cho volunteers và phù hợp nghĩa.","section":4},{"n":20,"prompt":"Choose the best option to complete blank (20).","opts":{"A":"everyone had already forgotten the original plan","B":"the event was cancelled before it could begin","C":"the team introduced a free monthly repair workshop","D":"the students collected no materials from local residents"},"answer":"C","explain":"Câu C phát triển logic chuỗi sự kiện và tạo tiền đề cho kết quả ở câu tiếp.","section":4},{"n":21,"prompt":"Choose the best option to complete blank (21).","opts":{"A":"As a result, several usable items were saved from being thrown away","B":"In contrast, students stopped caring about conservation","C":"For this reason, the workshop had never been planned","D":"Nevertheless, no visitors were allowed to participate"},"answer":"A","explain":"As a result nêu hệ quả tích cực của workshop trước đó.","section":4},{"n":22,"prompt":"Choose the best option to complete blank (22).","opts":{"A":"While community members never share their skills","B":"Since all broken goods must be replaced immediately","C":"Although this initiative is only useful for large cities","D":"By working together, small groups can create lasting changes Read the following passage and mark A, B, C or D to indicate the correct answer to each question from 23 to 30. GREEN SPACES AND HEALTHIER CITIES As cities expand, parks, trees and gardens are increasingly important. Vegetation can cool streets during hot weather, help mitigate some effects of air pollution, and provide places where people exercise or meet friends. Green areas also create habitats for birds and insects. Nevertheless, their benefits depend on thoughtful design and long-term care. Community gardens offer one way to bring nature closer to homes. Residents grow vegetables, exchange knowledge and build relationships with neighbours. These gardens may be small, but they provide shared spaces in crowded districts. They also encourage people to learn where food comes from and to appreciate seasonal changes. Access to greenery is not evenly distributed. In some neighbourhoods, residents can walk to a park within minutes, while others must travel much farther. Older people, young children and people with disabilities may face additional obstacles if paths and entrances are poorly designed. A successful green space should serve residents of different ages and abilities. For this reason, city planners need to prioritise accessible, safe public areas rather than only visually impressive projects. Local participation is essential to keep these places thriving. Residents can join tree-planting days, report damaged equipment and help maintain community gardens. Schools can organise outdoor lessons that encourage young people to value their surroundings. Although trees and parks alone cannot solve every urban problem, coordinated efforts can make cities more pleasant, healthier and better connected."},"answer":"D","explain":"D là câu kết khái quát phù hợp thông điệp hợp tác và bền vững.","section":4},{"n":23,"prompt":"Which of the following is NOT mentioned as a benefit of urban green spaces?","opts":{"A":"Offering places for physical activity","B":"Completely eliminating air pollution","C":"Supporting local wildlife","D":"Providing opportunities for social interaction"},"answer":"B","explain":"Bài chỉ nói giảm một phần ô nhiễm, không khẳng định loại bỏ hoàn toàn.","section":5},{"n":24,"prompt":"The word “they” in paragraph 2 refers to ______.","opts":{"A":"apartment buildings","B":"neighbourhoods","C":"community gardens","D":"local councils"},"answer":"C","explain":"“They” ở đoạn 2 thay cho community gardens.","section":5},{"n":25,"prompt":"The word “accessible” in paragraph 3 is OPPOSITE in meaning to ______.","opts":{"A":"reachable","B":"convenient","C":"available","D":"difficult to reach"},"answer":"D","explain":"Accessible là dễ tiếp cận; trái nghĩa difficult to reach.","section":5},{"n":26,"prompt":"The word “mitigate” in paragraph 1 is closest in meaning to ______.","opts":{"A":"reduce","B":"predict","C":"replace","D":"measure"},"answer":"A","explain":"Mitigate = lessen/reduce (giảm bớt tác động).","section":5},{"n":27,"prompt":"Which statement is TRUE according to the passage?","opts":{"A":"City parks can replace all forms of transport.","B":"Community involvement can help maintain green spaces.","C":"Green roofs are unsuitable for densely built areas.","D":"Every city has equal access to public parks."},"answer":"B","explain":"Đoạn 4 đề cập cư dân hỗ trợ chăm sóc và bảo vệ không gian xanh.","section":5},{"n":28,"prompt":"Which option best paraphrases the sentence “A successful green space should serve residents of different ages and abilities”?","opts":{"A":"People with disabilities should avoid outdoor recreation.","B":"Public gardens should mainly meet the needs of young people.","C":"Well-designed green spaces must be usable by a wide range of people.","D":"Green projects succeed only when they are expensive."},"answer":"C","explain":"Diễn đạt tương đương nguyên tắc thiết kế bao trùm cho nhiều nhóm dân cư.","section":5},{"n":29,"prompt":"In which paragraph does the writer discuss unequal access to greenery?","opts":{"A":"Paragraph 3","B":"Paragraph 1","C":"Paragraph 4","D":"Paragraph 2"},"answer":"A","explain":"Đoạn 3 thảo luận việc tiếp cận không gian xanh không đồng đều.","section":5},{"n":30,"prompt":"In which paragraph does the writer describe residents helping care for green areas?","opts":{"A":"Paragraph 3","B":"Paragraph 2","C":"Paragraph 1","D":"Paragraph 4 Read the following passage and mark A, B, C or D to indicate the correct answer to each question from 31 to 40. CROSS-CULTURAL COMMUNICATION IN DIGITAL TEAMS International teams increasingly collaborate through emails, messaging platforms and video meetings. These tools connect colleagues across continents, but they do not remove differences in communication habits. A message that appears clear to one person may sound abrupt or confusing to another. Developing cultural awareness is therefore an important part of successful online teamwork. In written communication, people often rely on brief messages because they are convenient. However, such messages lack facial expressions and gestures that might clarify their meaning. A subtle change in wording can alter how a request is received. In some workplaces, direct instructions are valued for efficiency; elsewhere, indirect suggestions may be considered more polite. Neither approach is automatically better in every situation. Video meetings provide more clues than written messages because participants can hear tone of voice and often see facial expressions. Yet those clues are not always interpreted identically. A long pause might signal careful thought in one setting but uncertainty in another. Team members should resist the temptation to interpret unfamiliar behaviour through their own cultural expectations alone. Response times can also lead to misunderstanding. One colleague may see a short reply as a sign of efficiency, while another may read it as a lack of interest. However, it might simply reflect a busy schedule or a preference for concise writing. Instead of assuming negative intentions, colleagues can ask polite questions and agree on reasonable response times. [I] Communication habits are influenced by culture, professional norms and individual personality. [II] No single style suits every workplace or situation. [III] Assumptions about another person’s intentions should be checked rather than treated as facts. [IV] Teams can make cooperation smoother by discussing preferred channels, deadlines and feedback styles. Shared expectations, combined with flexibility and respect, help people work confidently across borders."},"answer":"D","explain":"Đoạn 4 mô tả cư dân tham gia chăm sóc các khu vực xanh.","section":5},{"n":31,"prompt":"Where in paragraph 5 does the following sentence best fit? “These differences show why the same online message may be interpreted in very different ways.”","opts":{"A":"[I]","B":"[II]","C":"[III]","D":"[IV]"},"answer":"C","explain":"Câu này khái quát các khác biệt vừa nêu và đặt trước phần khuyến nghị ở [III].","section":6},{"n":32,"prompt":"The word “subtle” in paragraph 2 is OPPOSITE in meaning to ______.","opts":{"A":"indirect","B":"obvious","C":"delicate","D":"slight"},"answer":"B","explain":"Subtle = tinh tế/khó nhận thấy; obvious = rõ ràng.","section":6},{"n":33,"prompt":"The phrase “tone of voice” in paragraph 3 is closest in meaning to ______.","opts":{"A":"the volume of a written document","B":"the choice of a digital device","C":"the way someone’s voice expresses attitude","D":"the speed of an internet connection"},"answer":"C","explain":"Tone of voice là ngữ điệu, sắc thái giọng nói.","section":6},{"n":34,"prompt":"The word “it” in paragraph 4 refers to ______.","opts":{"A":"a shared calendar","B":"a short reply","C":"an unfamiliar language","D":"a video meeting"},"answer":"B","explain":"Trong ngữ cảnh, “it” thay thế “a short reply”.","section":6},{"n":35,"prompt":"Which of the following is NOT TRUE according to the passage?","opts":{"A":"Every culture interprets silence in exactly the same way.","B":"Written messages may lack non-verbal clues.","C":"Communication expectations can differ across cultures.","D":"Asking for clarification can prevent misunderstandings."},"answer":"A","explain":"Bài nhấn mạnh cách hiểu sự im lặng khác nhau giữa các nền văn hóa.","section":6},{"n":36,"prompt":"Which option best summarises paragraph 3?","opts":{"A":"Language differences have disappeared in international teamwork.","B":"Video calls remove every possible misunderstanding.","C":"Facial expressions are the same in every country.","D":"Spoken interaction offers additional clues, but cultural differences still matter."},"answer":"D","explain":"Đoạn 3 nói tới giọng nói/nét mặt là manh mối hữu ích nhưng có thể được hiểu khác nhau.","section":6},{"n":37,"prompt":"Which of the following is TRUE according to the passage?","opts":{"A":"Establishing shared expectations can make remote teamwork more effective.","B":"A fast reply always indicates agreement.","C":"Team members should avoid discussing preferred communication styles.","D":"All cultures regard direct criticism as respectful."},"answer":"A","explain":"Đoạn cuối khuyên thống nhất kỳ vọng chung để phối hợp hiệu quả.","section":6},{"n":38,"prompt":"Which option best paraphrases the sentence “Assumptions about another person’s intentions should be checked rather than treated as facts”?","opts":{"A":"Intentions cannot be clarified through respectful questions.","B":"People should verify what others mean instead of trusting first impressions.","C":"First impressions always reveal the speaker’s true intentions.","D":"It is best to ignore any confusion in international teams."},"answer":"B","explain":"Phải xác minh ý định bằng trao đổi, không biến phỏng đoán thành sự thật.","section":6},{"n":39,"prompt":"What can be inferred from the passage?","opts":{"A":"Technology alone is enough to guarantee successful teamwork.","B":"Cultural awareness is unnecessary in written communication.","C":"Effective global collaboration requires flexibility and open communication.","D":"Colleagues should avoid all direct conversations."},"answer":"C","explain":"Tổng hợp các luận điểm suy ra cần linh hoạt và giao tiếp cởi mở.","section":6},{"n":40,"prompt":"Which title best summarises the passage?","opts":{"A":"A Universal Set of Rules for Every Culture","B":"The History of Personal Computers","C":"Why Online Work Should Be Banned","D":"Communicating Effectively Across Cultures in Digital Teams"},"answer":"D","explain":"Nhan đề phản ánh vấn đề giao tiếp đa văn hóa trong nhóm làm việc trực tuyến.","section":6}],"sections":[{"id":1,"title":"TASK 1 – ADVERTISEMENT","range":[1,6],"passage":"ADVERTISEMENT – JOIN THE SCHOOL GREEN MAKERS CLUB","text":"Do you want to make your school more sustainable? The Green Makers Club offers practical tools (1) ______ help students turn ideas into action. You can protect the environment by (2) ______ our weekly projects and working with classmates who share your interests. Even small changes can make a (3) ______ difference. Our members build useful objects with (4) ______ and learn to reduce waste at school. This term, we invite everyone to (5) ______ a commitment to using fewer disposable products. With creativity and teamwork, we can transform old materials (6) ______ resources that benefit our community. Sign up at the school library this Friday!","translation":"Bạn có muốn làm cho trường học của mình phát triển bền vững hơn không? Câu lạc bộ Nhà sáng tạo Xanh cung cấp những công cụ thiết thực (1) ______ giúp học sinh biến ý tưởng thành hành động. Bạn có thể bảo vệ môi trường bằng cách (2) ______ các dự án hằng tuần của chúng tôi và làm việc cùng những bạn có chung sở thích. Ngay cả những thay đổi nhỏ cũng có thể tạo ra sự khác biệt (3) ______. Các thành viên tạo ra những vật dụng hữu ích từ (4) ______ và học cách giảm rác thải ở trường. Học kỳ này, chúng tôi mời mọi người (5) ______ cam kết sử dụng ít sản phẩm dùng một lần hơn. Với sự sáng tạo và tinh thần đồng đội, chúng ta có thể biến vật liệu cũ (6) ______ thành những nguồn lực có ích cho cộng đồng. Hãy đăng ký tại thư viện trường vào thứ Sáu này!"},{"id":2,"title":"TASK 2 – LEAFLET","range":[7,12],"passage":"LEAFLET – DISCOVER YOUR DIGITAL SKILLS","text":"The Student Technology Centre is launching a series of free workshops. (7) ______ students are interested in technology but are unsure where to begin. Our trained volunteers will (8) ______ practical workshops every Saturday. (9) ______ you have never tried coding or editing videos, you can still join. We offer (10) ______ sessions that explain the basics step by step. Participants will develop (11) ______ skills such as online safety, teamwork and problem-solving. Our aim is to help you learn (12) ______ experience rather than memorising technical terms. Bring your curiosity - no special equipment is required!","translation":"Trung tâm Công nghệ Học sinh đang tổ chức một loạt hội thảo miễn phí. (7) ______ học sinh quan tâm đến công nghệ nhưng chưa biết bắt đầu từ đâu. Các tình nguyện viên đã được đào tạo sẽ (8) ______ những buổi thực hành vào mỗi thứ Bảy. (9) ______ bạn chưa từng thử lập trình hoặc chỉnh sửa video, bạn vẫn có thể tham gia. Chúng tôi cung cấp các buổi học (10) ______ giải thích kiến thức cơ bản từng bước. Người tham gia sẽ phát triển những kỹ năng (11) ______ như an toàn trực tuyến, làm việc nhóm và giải quyết vấn đề. Mục tiêu của chúng tôi là giúp bạn học (12) ______ trải nghiệm thay vì ghi nhớ các thuật ngữ kỹ thuật. Hãy mang theo sự tò mò của bạn – không cần thiết bị đặc biệt!"},{"id":3,"title":"TASK 3 – ARRANGEMENT","range":[13,17],"passage":null,"text":null},{"id":4,"title":"TASK 4 – EXTENDED CLOZE","range":[18,22],"passage":"THE SECOND LIFE OF EVERYDAY THINGS","text":"The story of a student-led repair project (18) ______. It began when a group of teenagers noticed that many usable objects were being discarded simply because of minor damage. They invited local volunteers (19) ______. After collecting broken lamps, bags and bicycles from nearby homes, (20) ______. During the first event, volunteers worked alongside teenagers to explain simple repairs. (21) ______. More importantly, participants began to understand the environmental cost of constantly buying replacements. The project demonstrates a wider lesson about responsible consumption. (22) ______.","translation":"Câu chuyện về một dự án sửa chữa do học sinh khởi xướng (18) ______. Dự án bắt đầu khi một nhóm thanh thiếu niên nhận thấy nhiều đồ vật vẫn còn sử dụng được bị vứt bỏ chỉ vì hư hỏng nhỏ. Họ mời các tình nguyện viên địa phương (19) ______. Sau khi thu gom đèn, túi và xe đạp bị hỏng từ những ngôi nhà gần đó, (20) ______. Trong sự kiện đầu tiên, các tình nguyện viên làm việc cùng thanh thiếu niên để hướng dẫn những cách sửa chữa đơn giản. (21) ______. Quan trọng hơn, người tham gia bắt đầu hiểu được cái giá đối với môi trường của việc liên tục mua đồ thay thế. Dự án cho thấy một bài học rộng hơn về tiêu dùng có trách nhiệm. (22) ______."},{"id":5,"title":"TASK 5 – READING COMPREHENSION","range":[23,30],"passage":"GREEN SPACES AND HEALTHIER CITIES","text":"As cities expand, parks, trees and gardens are increasingly important. Vegetation can cool streets during hot weather, help mitigate some effects of air pollution, and provide places where people exercise or meet friends. Green areas also create habitats for birds and insects. Nevertheless, their benefits depend on thoughtful design and long-term care.\n\nCommunity gardens offer one way to bring nature closer to homes. Residents grow vegetables, exchange knowledge and build relationships with neighbours. These gardens may be small, but they provide shared spaces in crowded districts. They also encourage people to learn where food comes from and to appreciate seasonal changes.\n\nAccess to greenery is not evenly distributed. In some neighbourhoods, residents can walk to a park within minutes, while others must travel much farther. Older people, young children and people with disabilities may face additional obstacles if paths and entrances are poorly designed. A successful green space should serve residents of different ages and abilities. For this reason, city planners need to prioritise accessible, safe public areas rather than only visually impressive projects.\n\nLocal participation is essential to keep these places thriving. Residents can join tree-planting days, report damaged equipment and help maintain community gardens. Schools can organise outdoor lessons that encourage young people to value their surroundings. Although trees and parks alone cannot solve every urban problem, coordinated efforts can make cities more pleasant, healthier and better connected.","translation":"Khi các thành phố mở rộng, công viên, cây xanh và vườn tược ngày càng trở nên quan trọng. Thảm thực vật có thể làm mát đường phố khi thời tiết nóng, giúp giảm bớt một số tác động của ô nhiễm không khí và tạo ra những nơi để mọi người tập thể dục hoặc gặp gỡ bạn bè. Các khu vực xanh cũng tạo môi trường sống cho chim và côn trùng. Tuy nhiên, lợi ích của chúng phụ thuộc vào thiết kế hợp lý và việc chăm sóc lâu dài.\nVườn cộng đồng là một cách đưa thiên nhiên đến gần nhà hơn. Người dân trồng rau, trao đổi kiến thức và xây dựng mối quan hệ với hàng xóm. Những khu vườn này có thể nhỏ, nhưng cung cấp không gian chung ở các khu dân cư đông đúc. Chúng cũng khuyến khích mọi người tìm hiểu nguồn gốc thực phẩm và trân trọng sự thay đổi của các mùa.\nKhả năng tiếp cận không gian xanh không được phân bổ đồng đều. Ở một số khu dân cư, người dân có thể đi bộ đến công viên chỉ trong vài phút, trong khi những người khác phải đi xa hơn nhiều. Người cao tuổi, trẻ nhỏ và người khuyết tật có thể gặp thêm trở ngại nếu lối đi và lối vào được thiết kế không tốt. Một không gian xanh thành công cần phục vụ cư dân ở nhiều độ tuổi và có khả năng khác nhau. Vì vậy, các nhà quy hoạch đô thị cần ưu tiên những khu vực công cộng an toàn, dễ tiếp cận thay vì chỉ chú trọng các dự án có vẻ ngoài ấn tượng.\nSự tham gia của người dân địa phương là yếu tố thiết yếu để duy trì sức sống cho những nơi này. Người dân có thể tham gia các ngày trồng cây, báo cáo thiết bị hư hỏng và giúp chăm sóc vườn cộng đồng. Trường học có thể tổ chức các bài học ngoài trời nhằm khuyến khích người trẻ trân trọng môi trường xung quanh. Mặc dù cây xanh và công viên không thể tự mình giải quyết mọi vấn đề đô thị, những nỗ lực phối hợp có thể khiến thành phố dễ chịu hơn, lành mạnh hơn và gắn kết hơn."},{"id":6,"title":"TASK 6 – ADVANCED READING","range":[31,40],"passage":"CROSS-CULTURAL COMMUNICATION IN DIGITAL TEAMS","text":"International teams increasingly collaborate through emails, messaging platforms and video meetings. These tools connect colleagues across continents, but they do not remove differences in communication habits. A message that appears clear to one person may sound abrupt or confusing to another. Developing cultural awareness is therefore an important part of successful online teamwork.\n\nIn written communication, people often rely on brief messages because they are convenient. However, such messages lack facial expressions and gestures that might clarify their meaning. A subtle change in wording can alter how a request is received. In some workplaces, direct instructions are valued for efficiency; elsewhere, indirect suggestions may be considered more polite. Neither approach is automatically better in every situation.\n\nVideo meetings provide more clues than written messages because participants can hear tone of voice and often see facial expressions. Yet those clues are not always interpreted identically. A long pause might signal careful thought in one setting but uncertainty in another. Team members should resist the temptation to interpret unfamiliar behaviour through their own cultural expectations alone.\n\nResponse times can also lead to misunderstanding. One colleague may see a short reply as a sign of efficiency, while another may read it as a lack of interest. However, it might simply reflect a busy schedule or a preference for concise writing. Instead of assuming negative intentions, colleagues can ask polite questions and agree on reasonable response times.\n\n[I] Communication habits are influenced by culture, professional norms and individual personality. [II] No single style suits every workplace or situation. [III] Assumptions about another person’s intentions should be checked rather than treated as facts. [IV] Teams can make cooperation smoother by discussing preferred channels, deadlines and feedback styles. Shared expectations, combined with flexibility and respect, help people work confidently across borders.","translation":"Các nhóm quốc tế ngày càng hợp tác với nhau thông qua email, nền tảng nhắn tin và các cuộc họp video. Những công cụ này kết nối đồng nghiệp trên khắp các châu lục, nhưng không xóa bỏ sự khác biệt trong thói quen giao tiếp. Một thông điệp có vẻ rõ ràng với người này có thể nghe cộc lốc hoặc khó hiểu với người khác. Vì vậy, phát triển nhận thức văn hóa là một phần quan trọng của làm việc nhóm trực tuyến hiệu quả.\nTrong giao tiếp bằng văn bản, mọi người thường dựa vào những tin nhắn ngắn vì chúng tiện lợi. Tuy nhiên, những tin nhắn như vậy thiếu biểu cảm khuôn mặt và cử chỉ vốn có thể làm rõ ý nghĩa. Một thay đổi nhỏ trong cách diễn đạt có thể làm thay đổi cách người nhận hiểu yêu cầu. Ở một số nơi làm việc, chỉ dẫn trực tiếp được coi trọng vì tính hiệu quả; ở nơi khác, những lời gợi ý gián tiếp có thể được xem là lịch sự hơn. Không có cách nào luôn tốt hơn trong mọi tình huống.\nCác cuộc họp video cung cấp nhiều manh mối hơn tin nhắn văn bản vì người tham gia có thể nghe ngữ điệu và thường nhìn thấy nét mặt. Tuy nhiên, những manh mối đó không phải lúc nào cũng được diễn giải giống nhau. Một khoảng dừng dài có thể thể hiện sự suy nghĩ cẩn thận ở môi trường này nhưng lại là sự không chắc chắn ở môi trường khác. Các thành viên nhóm nên tránh diễn giải hành vi xa lạ chỉ dựa trên kỳ vọng văn hóa của chính mình.\nThời gian phản hồi cũng có thể dẫn đến hiểu lầm. Một đồng nghiệp có thể xem câu trả lời ngắn là dấu hiệu của sự hiệu quả, trong khi người khác lại hiểu đó là sự thiếu quan tâm. Tuy nhiên, điều đó có thể đơn giản phản ánh lịch trình bận rộn hoặc sở thích viết ngắn gọn. Thay vì giả định người khác có ý định tiêu cực, đồng nghiệp có thể đặt câu hỏi lịch sự và thống nhất thời gian phản hồi hợp lý.\n[I] Thói quen giao tiếp chịu ảnh hưởng của văn hóa, chuẩn mực nghề nghiệp và tính cách cá nhân. [II] Không có phong cách nào phù hợp với mọi nơi làm việc hay mọi tình huống. [III] Những giả định về ý định của người khác cần được kiểm chứng thay vì xem là sự thật. [IV] Các nhóm có thể hợp tác suôn sẻ hơn bằng cách thảo luận về kênh giao tiếp, thời hạn và cách phản hồi ưa thích. Những kỳ vọng chung, kết hợp với sự linh hoạt và tôn trọng, giúp mọi người làm việc tự tin xuyên biên giới."}],"translations":{"ADVERTISEMENT – JOIN THE SCHOOL GREEN MAKERS CLUB":"QUẢNG CÁO – THAM GIA CÂU LẠC BỘ NHÀ SÁNG TẠO XANH CỦA TRƯỜNG","Do you want to make your school more sustainable? The Green Makers Club offers practical tools (1) ______ help students turn ideas into action. You can protect the environment by (2) ______ our weekly projects and working with classmates who share your interests. Even small changes can make a (3) ______ difference. Our members build useful objects with (4) ______ and learn to reduce waste at school. This term, we invite everyone to (5) ______ a commitment to using fewer disposable products. With creativity and teamwork, we can transform old materials (6) ______ resources that benefit our community. Sign up at the school library this Friday!":"Bạn có muốn làm cho trường học của mình phát triển bền vững hơn không? Câu lạc bộ Nhà sáng tạo Xanh cung cấp những công cụ thiết thực (1) ______ giúp học sinh biến ý tưởng thành hành động. Bạn có thể bảo vệ môi trường bằng cách (2) ______ các dự án hằng tuần của chúng tôi và làm việc cùng những bạn có chung sở thích. Ngay cả những thay đổi nhỏ cũng có thể tạo ra sự khác biệt (3) ______. Các thành viên tạo ra những vật dụng hữu ích từ (4) ______ và học cách giảm rác thải ở trường. Học kỳ này, chúng tôi mời mọi người (5) ______ cam kết sử dụng ít sản phẩm dùng một lần hơn. Với sự sáng tạo và tinh thần đồng đội, chúng ta có thể biến vật liệu cũ (6) ______ thành những nguồn lực có ích cho cộng đồng. Hãy đăng ký tại thư viện trường vào thứ Sáu này!","LEAFLET – DISCOVER YOUR DIGITAL SKILLS":"TỜ RƠI – KHÁM PHÁ CÁC KỸ NĂNG SỐ CỦA BẠN","The Student Technology Centre is launching a series of free workshops. (7) ______ students are interested in technology but are unsure where to begin. Our trained volunteers will (8) ______ practical workshops every Saturday. (9) ______ you have never tried coding or editing videos, you can still join. We offer (10) ______ sessions that explain the basics step by step. Participants will develop (11) ______ skills such as online safety, teamwork and problem-solving. Our aim is to help you learn (12) ______ experience rather than memorising technical terms. Bring your curiosity - no special equipment is required!":"Trung tâm Công nghệ Học sinh đang tổ chức một loạt hội thảo miễn phí. (7) ______ học sinh quan tâm đến công nghệ nhưng chưa biết bắt đầu từ đâu. Các tình nguyện viên đã được đào tạo sẽ (8) ______ những buổi thực hành vào mỗi thứ Bảy. (9) ______ bạn chưa từng thử lập trình hoặc chỉnh sửa video, bạn vẫn có thể tham gia. Chúng tôi cung cấp các buổi học (10) ______ giải thích kiến thức cơ bản từng bước. Người tham gia sẽ phát triển những kỹ năng (11) ______ như an toàn trực tuyến, làm việc nhóm và giải quyết vấn đề. Mục tiêu của chúng tôi là giúp bạn học (12) ______ trải nghiệm thay vì ghi nhớ các thuật ngữ kỹ thuật. Hãy mang theo sự tò mò của bạn – không cần thiết bị đặc biệt!","THE SECOND LIFE OF EVERYDAY THINGS":"VÒNG ĐỜI THỨ HAI CỦA NHỮNG ĐỒ VẬT HẰNG NGÀY","The story of a student-led repair project (18) ______. It began when a group of teenagers noticed that many usable objects were being discarded simply because of minor damage. They invited local volunteers (19) ______. After collecting broken lamps, bags and bicycles from nearby homes, (20) ______. During the first event, volunteers worked alongside teenagers to explain simple repairs. (21) ______. More importantly, participants began to understand the environmental cost of constantly buying replacements. The project demonstrates a wider lesson about responsible consumption. (22) ______.":"Câu chuyện về một dự án sửa chữa do học sinh khởi xướng (18) ______. Dự án bắt đầu khi một nhóm thanh thiếu niên nhận thấy nhiều đồ vật vẫn còn sử dụng được bị vứt bỏ chỉ vì hư hỏng nhỏ. Họ mời các tình nguyện viên địa phương (19) ______. Sau khi thu gom đèn, túi và xe đạp bị hỏng từ những ngôi nhà gần đó, (20) ______. Trong sự kiện đầu tiên, các tình nguyện viên làm việc cùng thanh thiếu niên để hướng dẫn những cách sửa chữa đơn giản. (21) ______. Quan trọng hơn, người tham gia bắt đầu hiểu được cái giá đối với môi trường của việc liên tục mua đồ thay thế. Dự án cho thấy một bài học rộng hơn về tiêu dùng có trách nhiệm. (22) ______.","GREEN SPACES AND HEALTHIER CITIES":"KHÔNG GIAN XANH VÀ NHỮNG THÀNH PHỐ KHỎE MẠNH HƠN","As cities expand, parks, trees and gardens are increasingly important. Vegetation can cool streets during hot weather, help mitigate some effects of air pollution, and provide places where people exercise or meet friends. Green areas also create habitats for birds and insects. Nevertheless, their benefits depend on thoughtful design and long-term care.\nCommunity gardens offer one way to bring nature closer to homes. Residents grow vegetables, exchange knowledge and build relationships with neighbours. These gardens may be small, but they provide shared spaces in crowded districts. They also encourage people to learn where food comes from and to appreciate seasonal changes.\nAccess to greenery is not evenly distributed. In some neighbourhoods, residents can walk to a park within minutes, while others must travel much farther. Older people, young children and people with disabilities may face additional obstacles if paths and entrances are poorly designed. A successful green space should serve residents of different ages and abilities. For this reason, city planners need to prioritise accessible, safe public areas rather than only visually impressive projects.\nLocal participation is essential to keep these places thriving. Residents can join tree-planting days, report damaged equipment and help maintain community gardens. Schools can organise outdoor lessons that encourage young people to value their surroundings. Although trees and parks alone cannot solve every urban problem, coordinated efforts can make cities more pleasant, healthier and better connected.":"Khi các thành phố mở rộng, công viên, cây xanh và vườn tược ngày càng trở nên quan trọng. Thảm thực vật có thể làm mát đường phố khi thời tiết nóng, giúp giảm bớt một số tác động của ô nhiễm không khí và tạo ra những nơi để mọi người tập thể dục hoặc gặp gỡ bạn bè. Các khu vực xanh cũng tạo môi trường sống cho chim và côn trùng. Tuy nhiên, lợi ích của chúng phụ thuộc vào thiết kế hợp lý và việc chăm sóc lâu dài.\nVườn cộng đồng là một cách đưa thiên nhiên đến gần nhà hơn. Người dân trồng rau, trao đổi kiến thức và xây dựng mối quan hệ với hàng xóm. Những khu vườn này có thể nhỏ, nhưng cung cấp không gian chung ở các khu dân cư đông đúc. Chúng cũng khuyến khích mọi người tìm hiểu nguồn gốc thực phẩm và trân trọng sự thay đổi của các mùa.\nKhả năng tiếp cận không gian xanh không được phân bổ đồng đều. Ở một số khu dân cư, người dân có thể đi bộ đến công viên chỉ trong vài phút, trong khi những người khác phải đi xa hơn nhiều. Người cao tuổi, trẻ nhỏ và người khuyết tật có thể gặp thêm trở ngại nếu lối đi và lối vào được thiết kế không tốt. Một không gian xanh thành công cần phục vụ cư dân ở nhiều độ tuổi và có khả năng khác nhau. Vì vậy, các nhà quy hoạch đô thị cần ưu tiên những khu vực công cộng an toàn, dễ tiếp cận thay vì chỉ chú trọng các dự án có vẻ ngoài ấn tượng.\nSự tham gia của người dân địa phương là yếu tố thiết yếu để duy trì sức sống cho những nơi này. Người dân có thể tham gia các ngày trồng cây, báo cáo thiết bị hư hỏng và giúp chăm sóc vườn cộng đồng. Trường học có thể tổ chức các bài học ngoài trời nhằm khuyến khích người trẻ trân trọng môi trường xung quanh. Mặc dù cây xanh và công viên không thể tự mình giải quyết mọi vấn đề đô thị, những nỗ lực phối hợp có thể khiến thành phố dễ chịu hơn, lành mạnh hơn và gắn kết hơn.","CROSS-CULTURAL COMMUNICATION IN DIGITAL TEAMS":"GIAO TIẾP LIÊN VĂN HÓA TRONG CÁC NHÓM LÀM VIỆC TRỰC TUYẾN","International teams increasingly collaborate through emails, messaging platforms and video meetings. These tools connect colleagues across continents, but they do not remove differences in communication habits. A message that appears clear to one person may sound abrupt or confusing to another. Developing cultural awareness is therefore an important part of successful online teamwork.\nIn written communication, people often rely on brief messages because they are convenient. However, such messages lack facial expressions and gestures that might clarify their meaning. A subtle change in wording can alter how a request is received. In some workplaces, direct instructions are valued for efficiency; elsewhere, indirect suggestions may be considered more polite. Neither approach is automatically better in every situation.\nVideo meetings provide more clues than written messages because participants can hear tone of voice and often see facial expressions. Yet those clues are not always interpreted identically. A long pause might signal careful thought in one setting but uncertainty in another. Team members should resist the temptation to interpret unfamiliar behaviour through their own cultural expectations alone.\nResponse times can also lead to misunderstanding. One colleague may see a short reply as a sign of efficiency, while another may read it as a lack of interest. However, it might simply reflect a busy schedule or a preference for concise writing. Instead of assuming negative intentions, colleagues can ask polite questions and agree on reasonable response times.\n[I] Communication habits are influenced by culture, professional norms and individual personality. [II] No single style suits every workplace or situation. [III] Assumptions about another person’s intentions should be checked rather than treated as facts. [IV] Teams can make cooperation smoother by discussing preferred channels, deadlines and feedback styles. Shared expectations, combined with flexibility and respect, help people work confidently across borders.":"Các nhóm quốc tế ngày càng hợp tác với nhau thông qua email, nền tảng nhắn tin và các cuộc họp video. Những công cụ này kết nối đồng nghiệp trên khắp các châu lục, nhưng không xóa bỏ sự khác biệt trong thói quen giao tiếp. Một thông điệp có vẻ rõ ràng với người này có thể nghe cộc lốc hoặc khó hiểu với người khác. Vì vậy, phát triển nhận thức văn hóa là một phần quan trọng của làm việc nhóm trực tuyến hiệu quả.\nTrong giao tiếp bằng văn bản, mọi người thường dựa vào những tin nhắn ngắn vì chúng tiện lợi. Tuy nhiên, những tin nhắn như vậy thiếu biểu cảm khuôn mặt và cử chỉ vốn có thể làm rõ ý nghĩa. Một thay đổi nhỏ trong cách diễn đạt có thể làm thay đổi cách người nhận hiểu yêu cầu. Ở một số nơi làm việc, chỉ dẫn trực tiếp được coi trọng vì tính hiệu quả; ở nơi khác, những lời gợi ý gián tiếp có thể được xem là lịch sự hơn. Không có cách nào luôn tốt hơn trong mọi tình huống.\nCác cuộc họp video cung cấp nhiều manh mối hơn tin nhắn văn bản vì người tham gia có thể nghe ngữ điệu và thường nhìn thấy nét mặt. Tuy nhiên, những manh mối đó không phải lúc nào cũng được diễn giải giống nhau. Một khoảng dừng dài có thể thể hiện sự suy nghĩ cẩn thận ở môi trường này nhưng lại là sự không chắc chắn ở môi trường khác. Các thành viên nhóm nên tránh diễn giải hành vi xa lạ chỉ dựa trên kỳ vọng văn hóa của chính mình.\nThời gian phản hồi cũng có thể dẫn đến hiểu lầm. Một đồng nghiệp có thể xem câu trả lời ngắn là dấu hiệu của sự hiệu quả, trong khi người khác lại hiểu đó là sự thiếu quan tâm. Tuy nhiên, điều đó có thể đơn giản phản ánh lịch trình bận rộn hoặc sở thích viết ngắn gọn. Thay vì giả định người khác có ý định tiêu cực, đồng nghiệp có thể đặt câu hỏi lịch sự và thống nhất thời gian phản hồi hợp lý.\n[I] Thói quen giao tiếp chịu ảnh hưởng của văn hóa, chuẩn mực nghề nghiệp và tính cách cá nhân. [II] Không có phong cách nào phù hợp với mọi nơi làm việc hay mọi tình huống. [III] Những giả định về ý định của người khác cần được kiểm chứng thay vì xem là sự thật. [IV] Các nhóm có thể hợp tác suôn sẻ hơn bằng cách thảo luận về kênh giao tiếp, thời hạn và cách phản hồi ưa thích. Những kỳ vọng chung, kết hợp với sự linh hoạt và tôn trọng, giúp mọi người làm việc tự tin xuyên biên giới."}};
let sectionId=1, index=0, chosen={};
const $=id=>document.getElementById(id);
function unlock(){if($('pw').value==='367'){$('login').classList.add('hidden');$('app').classList.remove('hidden');buildNav();render()}else $('loginMsg').textContent='Incorrect password. Please try again.'}
function currentSection(){return DATA.sections.find(s=>s.id===sectionId)}
function qs(){return DATA.questions.filter(q=>q.section===sectionId)}
function buildNav(){$('sectionNav').innerHTML=DATA.sections.map(s=>`<button class="${s.id===sectionId?'active':''}" onclick="switchSection(${s.id})">${s.title}</button>`).join('')}
function switchSection(id){sectionId=id;index=0;buildNav();render()}
function render(){let s=currentSection(),list=qs(),q=list[index];$('sectionTag').textContent=`SECTION ${sectionId} / 6`;$('sectionTitle').textContent=s.title;$('qnum').textContent=`QUESTION ${q.n}`;$('progress').textContent=`${index+1} / ${list.length}`;$('prompt').textContent=q.prompt;
let passage=s.text;$('reading').classList.toggle('hidden',!passage);
if(passage){$('passageTitle').textContent=s.passage;$('passageText').textContent=passage;$('translationText').textContent=s.translation||'Bản dịch chưa có trong dữ liệu.';$('translationBox').classList.remove('show');$('translateBtn').textContent='🇻🇳 Show Vietnamese translation'}
if(sectionId===3){
 const lines=(q.arrangementLines||[]).map(x=>`<div class="arrange-line"><b>${x.letter}.</b> ${esc(x.text)}</div>`).join('');
 const opts=Object.entries(q.opts).map(([k,v])=>{let sel=chosen[q.n],cls='';if(sel){if(k===q.answer)cls='correct';else if(k===sel)cls='wrong'}return `<button class="arrange-choice ${cls}" ${sel?'disabled':''} onclick="answer('${k}')"><b>${k}.</b> ${esc(v)}</button>`}).join('');
 $('options').innerHTML=`<div class="arrange-grid"><section class="arrange-panel"><h4>Utterances / Sentences</h4>${lines}</section><section class="arrange-panel"><h4>Choose the correct order</h4>${opts}</section></div>`;
}else{
 $('options').innerHTML=Object.entries(q.opts).map(([k,v])=>{let sel=chosen[q.n],cls='';if(sel){if(k===q.answer)cls='correct';else if(k===sel)cls='wrong'}return `<button class="option ${cls}" ${sel?'disabled':''} onclick="answer('${k}')"><b>${k}.</b> ${esc(v)}</button>`}).join('');
}
let fb='';if(chosen[q.n]){let ok=chosen[q.n]===q.answer;fb=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Correct!':'Not quite.'}</b><br>Correct answer: <b>${q.answer}</b><br><b>Giải thích:</b> ${esc(q.explain)}<br><span class="small">Bạn đã chọn ${chosen[q.n]}.</span></div>`}$('feedback').innerHTML=fb;
$('prev').disabled=index===0;$('next').disabled=index===list.length-1;$('next').textContent=index===list.length-1?'End of section':'Next →';updateScore()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleTranslation(){let box=$('translationBox');box.classList.toggle('show');$('translateBtn').textContent=box.classList.contains('show')?'Hide Vietnamese translation':'🇻🇳 Show Vietnamese translation'}
function answer(k){let q=qs()[index];if(chosen[q.n])return;chosen[q.n]=k;render()}
function move(d){index=Math.max(0,Math.min(qs().length-1,index+d));render()}
function updateScore(){let list=qs(),done=list.filter(q=>chosen[q.n]).length,correct=list.filter(q=>chosen[q.n]===q.answer).length;let t=`Score: ${correct} / ${list.length} · Answered: ${done} / ${list.length}`;$('score').textContent=t;$('bottomScore').textContent=t}
function resetSection(){if(!confirm('Reset all answers in this section?'))return;qs().forEach(q=>delete chosen[q.n]);index=0;render()}
</script></body></html>
